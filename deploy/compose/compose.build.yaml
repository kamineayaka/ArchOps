# 源码构建 overlay（开发 / 发版前本地打镜像）
# 用法：
#   docker compose -f compose.yaml -f compose.build.yaml build
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        # Optional: https://maven.aliyun.com/repository/public
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: ${ARCHOPS_IMAGE_PREFIX:-ghcr.io/kamineayaka/archops}/backend:${ARCHOPS_VERSION:-latest}

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # Optional: https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${ARCHOPS_IMAGE_PREFIX:-ghcr.io/kamineayaka/archops}/frontend:${ARCHOPS_VERSION:-latest}
