services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archops}
      POSTGRES_USER: ${POSTGRES_USER:-archops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - archops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Control plane: API + embedded React static (image: archops:latest).
  # Design premise (ADR-0043): ≥2 replicas behind LB.
  # Local Compose (non-Swarm): scale with
  #   docker compose -f deploy/compose/compose.yaml up --scale archops=2
  # Swarm/K8s replicas wiring is Later.
  archops:
    image: ${ARCHOPS_IMAGE:-archops:latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      executor:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-archops}
      POSTGRES_USER: ${POSTGRES_USER:-archops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archops}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ARCHOPS_SSH_MODE: dispatch
      ARCHOPS_EXECUTOR_ADDRESS: executor:8443
      ARCHOPS_CREDENTIALS_ENCRYPTION_KEY_BASE64: ${ARCHOPS_CREDENTIALS_ENCRYPTION_KEY_BASE64:-}
    ports:
      - "${ARCHOPS_PORT:-8080}:8080"

  # 执行引擎 (ADR-0044 / ADR-0045). Same image, different jar. No AI 编排层 in this knife.
  executor:
    image: ${ARCHOPS_IMAGE:-archops:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_JAR: /app/executor.jar
      SPRING_PROFILES_ACTIVE: executor
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-archops}
      POSTGRES_USER: ${POSTGRES_USER:-archops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archops}
      ARCHOPS_SSH_MODE: mina
      ARCHOPS_EXECUTOR_GRPC_PORT: 8443
      ARCHOPS_EXECUTOR_ADDRESS: 127.0.0.1:8443
      ARCHOPS_CREDENTIALS_ENCRYPTION_KEY_BASE64: ${ARCHOPS_CREDENTIALS_ENCRYPTION_KEY_BASE64:-}
    ports:
      - "${ARCHOPS_EXECUTOR_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD-SHELL", "java -jar /app/executor.jar --health-probe"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  archops_pg:
