name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-lockfile:
    name: frontend npm ci (lockfile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify package-lock.json sync
        run: npm ci --no-audit --no-fund
      - name: Typecheck / unit smoke
        run: npm test

  frontend-lockfile-alpine:
    name: frontend npm ci (node:22-alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify lockfile on musl (matches Dockerfile)
        run: |
          docker run --rm \
            -v "$PWD/frontend:/app" -w /app \
            node:22-alpine \
            sh -c "npm ci --no-audit --no-fund"

  backend-compile:
    name: backend compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: ./mvnw -B -DskipTests compile
