# CI for ArchOps scaffold (ADR-0043). Vertical-slice tests come later.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-present:
    name: contract docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frozen docs
        run: |
          test -f CONTEXT.md
          test -f docs/adr/0039-domain-contract-frozen.md
          test -f docs/adr/0043-tech-stack.md
          test -f docs/scaffold-bootstrap-prompt.md

  backend:
    name: backend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
