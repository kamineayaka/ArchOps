name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-lockfile:
    name: frontend npm ci (lockfile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify package-lock.json sync
        run: npm ci --no-audit --no-fund
      - name: Typecheck / unit smoke
        run: npm test

  backend-compile:
    name: backend compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and unit tests
        run: ./mvnw -B test
