/**
 * China Maven/plugin mirrors. Kept as an explicit Gradle init script (`-I`)
 * for one-off runs; settings.gradle.kts + build.gradle.kts already apply the
 * same repositories by default.
 */
beforeSettings { settings ->
    settings.pluginManagement {
        repositories {
            maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
            maven { url "https://maven.aliyun.com/repository/public" }
            gradlePluginPortal()
            mavenCentral()
        }
    }
}

allprojects {
    buildscript {
        repositories {
            maven { url "https://maven.aliyun.com/repository/public" }
            maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
            mavenCentral()
            gradlePluginPortal()
        }
    }
    repositories {
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/spring" }
        maven { url "https://maven.aliyun.com/repository/google" }
        mavenCentral()
        gradlePluginPortal()
    }
}
