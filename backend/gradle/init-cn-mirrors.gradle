/**
 * Opt-in Maven/plugin mirrors for China VM Docker builds.
 * Loaded only when Dockerfile ARG ARCHOPS_CN_MIRRORS=1 (gradle -I).
 * Do not apply this on GitHub Actions / Cursor Cloud by default.
 */
beforeSettings { settings ->
    settings.pluginManagement {
        repositories {
            maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
            maven { url "https://maven.aliyun.com/repository/public" }
            gradlePluginPortal()
            mavenCentral()
        }
    }
}

allprojects {
    buildscript {
        repositories {
            maven { url "https://maven.aliyun.com/repository/public" }
            maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
            mavenCentral()
            gradlePluginPortal()
        }
    }
    repositories {
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/spring" }
        maven { url "https://maven.aliyun.com/repository/google" }
        mavenCentral()
        gradlePluginPortal()
    }
}
