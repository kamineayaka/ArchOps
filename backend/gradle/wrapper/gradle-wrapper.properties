distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.12.1-bin.zip
# Wrapper read timeout is per-socket-read (ms), not total download time.
# 10s is too short for a ~130MB zip on a slow or congested path; Docker
# backend-build then fails with SocketTimeoutException after ~20%.
networkTimeout=120000
# Tencent hosts the official zip; host is not services.gradle.org so skip URL-host check.
validateDistributionUrl=false
# Official gradle-8.12.1-bin.zip checksum (https://gradle.org/release-checksums/).
distributionSha256Sum=8d97a97984f6cbd2b85fe4c60a743440a347544bf18818048e611f5288d46c94
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
