syntax = "proto3";

package archops.executor.v1;

option java_multiple_files = true;
option java_package = "com.archops.executor.v1";

// ADR-0045 hub protocol. plan_id is correlation only; plaintext secrets are forbidden.
service Executor {
  rpc ExecuteStep(ExecuteStepRequest) returns (ExecuteStepResponse);
}

message ExecuteStepRequest {
  string plan_id = 1;
  int32 step_seq = 2;
  string action = 3;
  map<string, string> params = 4;
  string target_host_id = 5;
}

message ExecuteStepResponse {
  int32 step_seq = 1;
  bool success = 2;
  string structured_output = 3;
  string failure_reason = 4;
}
