server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: archops
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:archops}
    username: ${POSTGRES_USER:archops}
    password: ${POSTGRES_PASSWORD:archops}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: INFO
    com.archops: INFO

archops:
  diagnosis:
    poll-interval-ms: 200
  ai:
    enabled: ${ARCHOPS_AI_ENABLED:false}
    base-url: ${ARCHOPS_AI_BASE_URL:}
    api-key: ${ARCHOPS_AI_API_KEY:}
    model: ${ARCHOPS_AI_MODEL:deepseek-chat}
    allowlist-hosts:
      - api.openai.com
      - api.deepseek.com
