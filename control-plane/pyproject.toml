[project]
name = "archops-control-plane"
version = "0.1.0"
description = "Python control plane for HDFS and YARN."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
